name: Container Image Attestation

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and push image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/demo:latest .
          docker push ghcr.io/${{ github.repository }}/demo:latest

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect ghcr.io/${{ github.repository }}/demo:latest --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "sha256=$DIGEST" >> $GITHUB_OUTPUT

      - name: Attest container image
        uses: actions/github-script@v7
        with:
          script: |
            const { attest } = require('@actions/attest');

            await attest({
              subjects: [
                {
                  name: `ghcr.io/${process.env.REPO}/demo:latest`,
                  digest: { sha256: process.env.DIGEST }
                }
              ],
              predicateType: 'https://in-toto.io/attestation/container',
              predicate: { image: 'demo container build' },
              token: core.getInput('gh-token')
            });
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          env:
            REPO: ${{ github.repository }}
            DIGEST: ${{ steps.digest.outputs.sha256 }}
