name: Artifact Storage Record

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  storage-record:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir dist
          echo "storage test" > dist/item.txt

      - name: Compute digest
        id: digest
        run: |
          DIGEST=$(sha256sum dist/item.txt | awk '{print $1}')
          echo "sha256=$DIGEST" >> $GITHUB_OUTPUT

      - name: Create storage record
        uses: actions/github-script@v7
        with:
          script: |
            const { createStorageRecord } = require('@actions/attest');

            await createStorageRecord({
              artifactName: 'item.txt',
              artifactDigest: { sha256: process.env.DIGEST },
              packageType: 'generic',
              packageName: 'loop-engineering',
              registryUri: `https://github.com/${process.env.REPO}/packages`,
              token: core.getInput('gh-token')
            });
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          env:
            REPO: ${{ github.repository }}
            DIGEST: ${{ steps.digest.outputs.sha256 }}
