name: Rekor Attestation

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  rekor-attest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir dist
          echo "rekor test" > dist/r.txt

      - name: Compute digest
        id: digest
        run: |
          DIGEST=$(sha256sum dist/r.txt | awk '{print $1}')
          echo "sha256=$DIGEST" >> $GITHUB_OUTPUT

      - name: Attest with Rekor
        uses: actions/github-script@v7
        with:
          script: |
            const { attest } = require('@actions/attest');

            await attest({
              subjects: [
                {
                  name: 'r.txt',
                  digest: { sha256: process.env.DIGEST }
                }
              ],
              predicateType: 'https://in-toto.io/attestation/release',
              predicate: { release: 'rekor test' },
              sigstore: 'public-good',
              token: core.getInput('gh-token')
            });
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          env:
            DIGEST: ${{ steps.digest.outputs.sha256 }}
